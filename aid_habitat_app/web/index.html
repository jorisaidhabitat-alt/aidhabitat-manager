<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="App'Ergo — relevés de visite à domicile, dossiers ANAH, préconisations.">
  <meta name="theme-color" content="#907CA1">

  <!-- iOS / iPadOS PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="App'Ergo">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>App'Ergo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body,
    flutter-view,
    flt-glass-pane,
    flt-scene-host,
    canvas {
      touch-action: none;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      overflow: hidden;
    }
  </style>

  <!--
    pdfjs-dist : nécessaire au package `pdfx` côté web pour
    rasteriser les PDF (`PdfDocument.openData`). Sans ce script, on
    obtient `Exception: Pdfjs library not loaded` à l'ouverture du
    moindre PDF.

    Version 2.13.216 — proven stable avec `pdfx ^2.6.x` (cf. la doc
    officielle du package).

    Bundlé localement dans `web/pdfjs/` (au lieu d'un CDN unpkg.com)
    depuis 2026-05-07 pour garantir le fonctionnement 100 % offline :
    le service worker Flutter cache automatiquement les assets
    same-origin, donc PDF.js reste dispo même si l'iPad part offline
    avant le 1er load PDF (avant ce changement, le browser cache HTTP
    pouvait évincer le script CDN et casser la preview offline).
    Voir `web/pdfjs/pdf.min.js` (~230 Ko) + `pdf.worker.min.js`
    (~1 Mo). Mise à jour : remplacer les deux fichiers manuellement
    en récupérant la version voulue depuis https://unpkg.com/pdfjs-dist/.
  -->
  <script src="pdfjs/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js';
    } else {
      console.warn('[pdfjs] pdf.min.js non chargé — vérifier que web/pdfjs/ est bien servi.');
    }
  </script>
  <script>
    // iPadOS/Safari peut annuler ou détourner des micro-traits Apple Pencil
    // lorsque la page ne verrouille pas explicitement le flux Pointer Events.
    // On laisse Flutter recevoir les événements, mais on empêche le navigateur
    // de les interpréter comme scroll, sélection, handwriting ou gesture.
    (function installApplePencilGuards() {
      const params = new URLSearchParams(window.location.search);
      const debugEnabled = params.get('pencilDebug') === '1' ||
        params.get('debugPencil') === '1';
      const debugState = {
        counts: {},
        lastEvents: []
      };
      let debugPanel = null;

      const ensureDebugPanel = function() {
        if (!debugEnabled || debugPanel) return debugPanel;
        debugPanel = document.createElement('pre');
        debugPanel.style.position = 'fixed';
        debugPanel.style.right = '12px';
        debugPanel.style.bottom = '12px';
        debugPanel.style.zIndex = '2147483647';
        debugPanel.style.maxWidth = '360px';
        debugPanel.style.maxHeight = '42vh';
        debugPanel.style.overflow = 'hidden';
        debugPanel.style.margin = '0';
        debugPanel.style.padding = '10px 12px';
        debugPanel.style.borderRadius = '14px';
        debugPanel.style.background = 'rgba(17, 24, 39, 0.88)';
        debugPanel.style.color = '#F9FAFB';
        debugPanel.style.font = '11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace';
        debugPanel.style.pointerEvents = 'none';
        debugPanel.style.whiteSpace = 'pre-wrap';
        debugPanel.textContent = 'Native pointer debug...';
        document.body.appendChild(debugPanel);
        return debugPanel;
      };

      const renderDebugPanel = function() {
        const panel = ensureDebugPanel();
        if (!panel) return;
        const counts = Object.keys(debugState.counts)
          .sort()
          .map(function(key) {
            return key + ': ' + debugState.counts[key];
          })
          .join('\n');
        panel.textContent = [
          'Native pointer debug',
          'URL: ?pencilDebug=1',
          counts || 'no events yet',
          '',
          'last:',
          debugState.lastEvents.join('\n')
        ].join('\n');
      };

      const recordNativePointer = function(event) {
        if (!debugEnabled) return;
        const type = event.pointerType || 'unknown';
        const key = event.type + ':' + type;
        debugState.counts[key] = (debugState.counts[key] || 0) + 1;
        if (event.type !== 'pointermove' || debugState.counts[key] % 8 === 0) {
          const pressure = typeof event.pressure === 'number'
            ? event.pressure.toFixed(2)
            : '-';
          debugState.lastEvents.unshift(
            new Date().toLocaleTimeString() + ' ' +
            event.type.replace('pointer', '') + ' ' +
            type + ' #' + event.pointerId +
            ' p=' + pressure +
            ' x=' + Math.round(event.clientX) +
            ' y=' + Math.round(event.clientY)
          );
          debugState.lastEvents = debugState.lastEvents.slice(0, 10);
        }
        renderDebugPanel();
      };

      window.__aidPencilDebug = debugState;
      if (debugEnabled) {
        window.addEventListener('load', renderDebugPanel, { once: true });
      }

      const preventPencilDefault = function(event) {
        recordNativePointer(event);
        if (event.pointerType !== 'pen') return;
        if (event.target && event.target.setPointerCapture && event.type === 'pointerdown') {
          try {
            event.target.setPointerCapture(event.pointerId);
          } catch (_) {
            // setPointerCapture peut échouer si la cible DOM est remplacée.
          }
        }
        event.preventDefault();
      };

      ['pointerdown', 'pointermove', 'pointerup', 'pointercancel'].forEach(function(type) {
        window.addEventListener(type, preventPencilDefault, {
          capture: true,
          passive: false
        });
      });
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
